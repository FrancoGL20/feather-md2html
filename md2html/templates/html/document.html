<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{title}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f97316' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'></path><polyline points='14 2 14 8 20 8'></polyline></svg>">
  <style>
{styles}
  </style>
</head>
<body>
  <div class="container">
    <!-- Cross-Document Navigation Bar -->
    <nav class="top-nav-bar" aria-label="Navegación de biblioteca">
      <div class="nav-links-group">
        <a href="./index.html" class="nav-pill-btn" title="Ir al catálogo de todos los archivos generados">
          {icon_folder}
          <span>Índice de Documentos</span>
        </a>
        <a href="./latest.html" class="nav-pill-btn" title="Ir a la página más nueva creada">
          {icon_bolt}
          <span>Más Reciente</span>
        </a>
      </div>
      <button class="theme-toggle-btn" id="theme-btn" onclick="toggleTheme()" title="Alternar tema claro/oscuro">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <span>Tema</span>
      </button>
    </nav>

    <header>
      <h1>{header_title} {header_badge}</h1>
      {header_subtitle}
      <div class="header-meta">
        <span>⏱️ {reading_time}</span>
        <span>📝 {word_count} palabras</span>
        <span>📅 Generado el {generated_date}</span>
      </div>
    </header>

    <main>
{toc_content}
{body_content}
    </main>

    <footer>
      <span>Biblioteca Markdown HTML</span>
      <span>{footer_date}</span>
    </footer>
  </div>

  <script>
    function initTheme() {{
      const saved = localStorage.getItem('apple-md-theme');
      if (saved === 'light') {{
        document.documentElement.classList.add('light');
      }} else if (saved === 'dark') {{
        document.documentElement.classList.remove('light');
      }}
    }}
    function toggleTheme() {{
      const isLight = document.documentElement.classList.contains('light');
      if (isLight) {{
        document.documentElement.classList.remove('light');
        localStorage.setItem('apple-md-theme', 'dark');
      }} else {{
        document.documentElement.classList.add('light');
        localStorage.setItem('apple-md-theme', 'light');
      }}
      if (typeof renderMermaidDiagrams === 'function') {{
        renderMermaidDiagrams();
      }}
    }}
    initTheme();

    function measureLeadingIndentCols(text, tabSize) {{
      if (!text || !text.trim()) return {{ cols: 0, mixedAfterTab: false }};
      let cols = 0;
      let seenTab = false;
      let mixedAfterTab = false;
      for (let i = 0; i < text.length; i++) {{
        const ch = text[i];
        if (ch === '\t') {{
          seenTab = true;
          cols += tabSize - (cols % tabSize);
        }} else if (ch === ' ') {{
          if (seenTab) mixedAfterTab = true;
          cols += 1;
        }} else {{
          break;
        }}
      }}
      return {{ cols, mixedAfterTab }};
    }}

    function isolateMixedIndentBox(container, totalCols) {{
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
      const firstNode = walker.nextNode();
      if (!firstNode) return;
      const val = firstNode.nodeValue || '';
      const m = val.match(/^([ \t]+)/);
      if (!m) return;
      const ws = m[1];
      const rest = val.slice(ws.length);
      const box = document.createElement('span');
      box.className = 'code-indent-box';
      box.style.width = totalCols + 'ch';
      box.textContent = ws;
      const parent = firstNode.parentNode;
      parent.insertBefore(box, firstNode);
      if (rest) {{
        firstNode.nodeValue = rest;
      }} else {{
        parent.removeChild(firstNode);
      }}
    }}

    function extractSelectedCodeLines(pre, range) {{
      const lineEls = Array.from(pre.querySelectorAll('.code-line'));
      if (lineEls.length === 0) return null;

      const picked = [];
      let endsWithTrailingNewline = false;

      for (let i = 0; i < lineEls.length; i++) {{
        const lineEl = lineEls[i];
        if (!range.intersectsNode(lineEl)) continue;

        const lineRange = document.createRange();
        lineRange.selectNodeContents(lineEl);

        const cmpStart = range.compareBoundaryPoints(Range.START_TO_START, lineRange);
        const cmpEnd = range.compareBoundaryPoints(Range.END_TO_END, lineRange);

        if (cmpStart > 0) {{
          lineRange.setStart(range.startContainer, range.startOffset);
        }}
        if (cmpEnd < 0) {{
          lineRange.setEnd(range.endContainer, range.endOffset);
        }}

        if (cmpEnd < 0 && lineRange.collapsed && picked.length > 0) {{
          endsWithTrailingNewline = true;
          break;
        }}

        picked.push(lineRange.toString());
      }}

      if (picked.length === 0) return null;
      return picked.join('\n') + (endsWithTrailingNewline ? '\n' : '');
    }}

    function initCodeBlocks() {{
      document.querySelectorAll('.code-block pre code').forEach(code => {{
        if (!code.querySelector('.code-line')) {{
          const lines = code.innerHTML.split('\n');
          code.innerHTML = lines.map(line =>
            line === ''
              ? '<span class="code-line"></span>'
              : `<span class="code-line"><span class="code-text">${{line}}</span></span>`
          ).join('');
        }}

        code.querySelectorAll('.code-line').forEach(lineEl => {{
          const info = measureLeadingIndentCols(lineEl.textContent || '', 4);
          if (info.cols > 0) {{
            lineEl.style.setProperty('--indent-cols', String(info.cols));
            lineEl.setAttribute('data-indented', '1');
            if (info.mixedAfterTab) {{
              const ct = lineEl.querySelector('.code-text');
              if (ct) isolateMixedIndentBox(ct, info.cols);
            }}
          }} else {{
            lineEl.style.setProperty('--indent-cols', '0');
            lineEl.setAttribute('data-indented', '0');
          }}
        }});
      }});

      document.querySelectorAll('.code-block pre').forEach(pre => {{
        if (pre.dataset.copyBound) return;
        pre.dataset.copyBound = '1';
        pre.addEventListener('copy', (e) => {{
          const sel = window.getSelection();
          if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
          const range = sel.getRangeAt(0);
          if (!pre.contains(range.commonAncestorContainer)) return;

          const finalText = extractSelectedCodeLines(pre, range);
          if (finalText !== null && e.clipboardData) {{
            e.clipboardData.setData('text/plain', finalText);
            e.preventDefault();
          }}
        }});
      }});
    }}
    initCodeBlocks();

    function toggleCodeWrap(btn) {{
      const block = btn.closest('.code-block');
      const isNoWrap = block.classList.toggle('no-wrap');
      if (isNoWrap) {{
        btn.classList.remove('active');
        btn.title = 'Activar ajuste de línea';
      }} else {{
        btn.classList.add('active');
        btn.title = 'Desactivar ajuste de línea';
      }}
    }}

    function copyCode(btn) {{
      const codeBlock = btn.closest('.code-block');
      const lines = codeBlock.querySelectorAll('.code-line');
      let text = '';
      if (lines.length > 0) {{
        text = Array.from(lines).map(l => l.textContent).join('\n');
      }} else {{
        text = codeBlock.querySelector('pre code').textContent;
      }}
      navigator.clipboard.writeText(text).then(() => {{
        const orig = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = '✓ Copiado';
        setTimeout(() => {{
          btn.innerHTML = orig;
          btn.classList.remove('copied');
        }}, 2000);
      }});
    }}
  </script>
{mermaid_scripts}
{math_scripts}
</body>
</html>
